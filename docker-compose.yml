services:
  # Auth: run `gcloud auth application-default login` in the workspace container to authenticate.
  # ADC credentials are shared through the named gcloud_config volume.
  # IAM roles needed: Vertex AI User, Cloud Trace Agent
  agent:
    build:
      context: ./services/backend/agents
      dockerfile: Dockerfile
      # Dev uses the deps-only stage; source comes from the bind mount below.
      # CI builds `--target prod` (source baked in) for Cloud Run.
      target: base
    volumes:
      - ./services/backend/agents:/workspace
      - gcloud_config:/root/.config/gcloud:ro
      - uploads:/data/uploads
      # Read-only: lets the platform API reconstruct the SQL behind tool calls.
      - ./services/backend/mcp/images/toolbox:/toolbox-config:ro
    ports:
      - "${AGENT_PORT:-8000}:${AGENT_PORT:-8000}"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=${AGENT_PORT:-8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://frontend:3000}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://user:password@postgres:5432/postgres}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-true}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-nd-agentspace-sbx}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-northamerica-northeast1}
      - TOOLBOX_ENDPOINT=${TOOLBOX_ENDPOINT:-http://mcp-toolbox:5000}
      - MCP_STATS_URL=${MCP_STATS_URL:-http://mcp-stats:8080/sse}
      - UV_LINK_MODE=copy
      # Uploaded data sources — local volume in dev, swap to STORAGE_BACKEND=gcs when deployed.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_LOCAL_PATH=/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      # The `migrate` service runs `alembic upgrade head`; waiting on it to
      # complete means the platform schema is at head before the agent reads or
      # writes tables. (ADK manages its own tables and is unaffected by this.)
      # The agent no longer waits on the gateway — it sits *behind* the gateway.
      migrate:
        condition: service_completed_successfully
      mcp-toolbox:
        condition: service_started
    stdin_open: true
    tty: true
    command: uv run uvicorn main:app --host 0.0.0.0 --port ${AGENT_PORT:-8000} --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${AGENT_PORT:-8000}/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ── Image-based MCP servers ────────────────────────────────────────────────
  # These servers are consumed as images — no source code maintained here.
  # Config/env templates live in services/backend/mcp/images/<name>/.

  # Auth: shares ADC credentials from the workspace container via gcloud_config.
  # IAM roles needed: BigQuery Data Viewer, BigQuery Job User
  mcp-toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.1.0
    volumes:
      - ./services/backend/mcp/images/toolbox:/workspace:ro
      - gcloud_config:/root/.config/gcloud:ro
    ports:
      - "${MCP_PORT:-5000}:${MCP_PORT:-5000}"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-nd-agentspace-sbx}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-northamerica-northeast1}
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    user: root
    command: --config /workspace/tools.yaml --address 0.0.0.0 --port ${MCP_PORT:-5000} --ui

  # Auth: OAuth2 client credentials required.
  # Secrets-backed .env is generated by scripts/start_services.sh.
  # Exposes streamable-http at http://localhost:5001/mcp when OAuth vars are set.
  mcp-google-ads:
    build:
      context: ./services/backend/mcp/images/google-ads
      args:
        - GOOGLE_ADS_MCP_REF=${GOOGLE_ADS_MCP_REF:-main}
    env_file:
      - path: ./services/backend/mcp/images/google-ads/.env
        required: false
    volumes:
      - gcloud_config:/root/.config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    ports:
      - "${GOOGLE_ADS_MCP_PORT:-5001}:8080"
    profiles:
      - google-ads
    stdin_open: true
    tty: true

  # ── Code-based MCP servers ─────────────────────────────────────────────────
  # These servers are built from source in this repo.
  # Each has its own Dockerfile under services/backend/mcp/<name>/.

  mcp-math:
    build:
      context: ./services/backend/mcp/math
    ports:
      - "${MATH_MCP_PORT:-5002}:8080"
    profiles:
      - math
    stdin_open: true
    tty: true

  # Statistics & correlation analysis engine. Resolves data sources via the
  # agent API and reads uploads from the shared volume.
  mcp-stats:
    build:
      context: ./services/backend/mcp/stats
    volumes:
      - uploads:/data/uploads:ro
      - gcloud_config:/root/.config/gcloud:ro
    ports:
      - "${STATS_MCP_PORT:-5003}:8080"
    environment:
      - AGENT_URL=${AGENT_URL:-http://agent:8000}
      - STORAGE_LOCAL_PATH=/data/uploads
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-nd-agentspace-sbx}
    depends_on:
      agent:
        condition: service_started
    stdin_open: true
    tty: true
    healthcheck:
      # python:3.13-slim has no curl — use urllib instead.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  mcp-asana:
    build:
      context: ./services/backend/mcp/asana
    ports:
      - "${ASANA_MCP_PORT:-5004}:8080"
    profiles:
      - asana
    stdin_open: true
    tty: true

  # ── Database migrations — one-shot, runs to completion before any API ──────
  # Owns `alembic upgrade head` (the gateway package owns the schema, so we
  # reuse its image). The gateway and the agent both wait on this with
  # `service_completed_successfully`, so the schema is always at head before
  # anything reads/writes it. This is the local mirror of the CI/CD pre-deploy
  # step (`gcloud run jobs execute migrate`) that runs before new API revisions
  # take traffic — keeping migrations OUT of app boot avoids cold-start races
  # across multiple Cloud Run replicas.
  migrate:
    build:
      context: ./services/backend/gateway
      dockerfile: Dockerfile
      target: base
    volumes:
      - ./services/backend/gateway:/workspace
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://user:password@postgres:5432/postgres}
      - UV_LINK_MODE=copy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: uv run alembic upgrade head

  # ── Gateway — the public entry point for the frontend ─────────────────────
  # Owns auth, the platform's non-agent HTTP routes, and the public API. It is
  # the ONLY service the frontend talks to; everything it doesn't handle
  # directly is proxied to the private agent service (`/run_sse` streams through
  # unchanged — see api/proxy.py). The schema is owned by the `migrate` service:
  # the gateway waits on it (`service_completed_successfully`) so it never serves
  # against an out-of-date schema.
  gateway:
    build:
      context: ./services/backend/gateway
      dockerfile: Dockerfile
      # Dev uses the deps-only stage; source comes from the bind mount below.
      # CI builds `--target prod` (source baked in) for Cloud Run.
      target: base
    volumes:
      - ./services/backend/gateway:/workspace
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    environment:
      - PORT=${GATEWAY_PORT:-8080}
      - AGENT_URL=${AGENT_URL_INTERNAL:-http://agent:8000}
      - STATS_URL=${STATS_URL_INTERNAL:-http://mcp-stats:8080}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://user:password@postgres:5432/postgres}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://frontend:3000}
      - UV_LINK_MODE=copy
      # No Firebase here: identity is verified at the BFF (frontend) and forwarded
      # as X-User-* over the gateway's IAM-gated channel; the gateway trusts it.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: uv run uvicorn main:app --host 0.0.0.0 --port ${GATEWAY_PORT:-8080} --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${GATEWAY_PORT:-8080}/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ── Firebase Auth emulator (dev only) ──────────────────────────────────────
  # Local Firebase Auth so the whole stack runs real auth flows without touching
  # a real Firebase project: the frontend's client SDK signs in against it and
  # the frontend's Admin SDK (the BFF) verifies the resulting tokens / session
  # cookies. Auth on 9099, emulator UI on 4000 (ports in ./firebase.json).
  #
  # Dev project id mirrors the tenant with a `-local` suffix. No real GCP creds
  # are needed because every SDK is pointed at the emulator (the AUTH_EMULATOR
  # _HOST vars). It MUST match the client/admin project id below or cookie
  # verification fails.
  firebase-emulator:
    build:
      context: ./tooling/firebase-emulator
      dockerfile: Dockerfile
    volumes:
      - ./firebase.json:/firebase/firebase.json:ro
    ports:
      - "${FIREBASE_AUTH_EMULATOR_PORT:-9099}:9099"
      - "${FIREBASE_EMULATOR_UI_PORT:-4000}:4000"
    command: firebase emulators:start --only auth --project ${FIREBASE_PROJECT_ID:-nd-agentspace-local}
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # The browser talks ONLY to the Next.js BFF proxy at /gw (same origin);
      # the proxy forwards to the gateway server-side over the docker network.
      # GATEWAY_URL is server-only — never shipped to the browser — so the
      # gateway URL stays private and the gateway can be internal-ingress in
      # prod. (Gateway proxies onward to the private agent / toolbox / stats.)
      - GATEWAY_URL=${GATEWAY_URL:-http://gateway:8080}
      # Firebase Auth (client SDK, runs in the browser). Dev values pair with the
      # local emulator; the emulator host is the *browser-reachable* address
      # (published port on localhost), not the docker-network name. Per-tenant
      # real values are injected at deploy time (apphosting.yaml).
      # Dev project id (mirrors the tenant, `-local` suffix); must match the
      # emulator's --project. (Prod: real values from apphosting.yaml.)
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-nd-agentspace-local}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-demo-api-key}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-nd-agentspace-local.firebaseapp.com}
      - NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST=${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST:-http://localhost:9099}
      # Server-side: the Admin SDK (BFF session verify) reaches the emulator over
      # the docker network, not the browser's localhost. Unset in prod → the
      # Admin SDK uses ADC (the App Hosting service account).
      - FIREBASE_AUTH_EMULATOR_HOST=${FIREBASE_AUTH_EMULATOR_HOST:-firebase-emulator:9099}
      # Access control: only these email domains may start a session (comma-
      # separated). Empty = allow any (dev default). Set to your org domains in
      # prod, e.g. "noisedigital.com,havas.com". Enforced in the session route.
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-}
    depends_on:
      gateway:
        condition: service_started
      firebase-emulator:
        condition: service_started
    stdin_open: true
    tty: true
    command: npm run dev
    healthcheck:
      # Next.js's dev server responds with HTML on `/`. Bare TCP probe would
      # be cheaper but doesn't catch a wedged compile, so we hit the route.
      # node:24-slim has no curl — use Node's native fetch (18+).
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:${FRONTEND_PORT:-3000}').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: public.ecr.aws/docker/library/postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./services/backend/database/init:/docker-entrypoint-initdb.d:ro
      # Postgres 18+ stores data under /var/lib/postgresql/<major>/ and rejects a
      # mount at /var/lib/postgresql/data — mount the parent. (docker-library/postgres#1259)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volumes persist data across container rebuilds.
# - postgres_data: retains DB data so it survives container recreation
# - frontend_node_modules: caches node_modules so npm install only runs at build time,
#   not on every container start (the bind mount would otherwise shadow the image's node_modules)
# - uploads: stores uploaded analysis data sources; shared with the stats MCP server
volumes:
  gcloud_config:
  postgres_data:
  frontend_node_modules:
  uploads:
