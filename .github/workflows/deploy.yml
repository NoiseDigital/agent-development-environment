name: Migrate DB & Deploy Services

# Build images, run DB migrations, roll Cloud Run — fanned out over EVERY deploy
# target (a tenant × stage, e.g. `noise-sbx`). Auth is keyless via Workload
# Identity Federation (no JSON keys).
#
# WHERE CONFIG LIVES
#   - Which targets exist:  .github/deploy-targets.json  (tenant, stage, trigger)
#   - Per-target values:    GitHub Environment `<tenant>-<stage>` (Settings →
#     Environments) — DEPLOY_PROJECT, ARTIFACT_REGISTRY, GCP_REGION,
#     GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_CI_SERVICE_ACCOUNT,
#     NEXT_PUBLIC_FIREBASE_APP_ID, NEXT_PUBLIC_GA_SERVER_CONTAINER_URL.
#   This workflow reads NO tenant/stage-specific value itself, so adding a target
#   = add a row to deploy-targets.json + create its Environment. No workflow edit.
#   (The tenant's branding + enabled modules come from tenants/<id>.json, baked
#   into the frontend image via NEXT_PUBLIC_TENANT; the GA4 measurement id is
#   baked there too — never a deploy var, so tenants can't cross-contaminate.)
#
# TRIGGERS — trunk-based promotion (industry standard: one trunk, tags promote up)
#   push to a branch   → every "trigger": "push" target whose "branch" matches
#                        (default branch "main"). This is the low/integration
#                        stage — typically all *-sbx.
#   push a tag         → promote a single env: tag `deploy/<tenant>/<stage>/<ver>`
#                        (e.g. deploy/noise/prod/v1.4.0) deploys exactly that
#                        registered target. Higher stages should also set REQUIRED
#                        REVIEWERS on their GitHub Environment so the run pauses
#                        for approval — gating is orthogonal to the trigger.
#   workflow_dispatch  → the chosen `environment` (escape hatch / redeploy), or
#                        ALL push targets on the selected branch if blank.
#   Tag + dispatch runs force a FULL deploy (all services); branch pushes only
#   roll services whose source changed.

on:
  push:
    branches: [main] # add a branch here if a target sets "branch" to it
    tags: ["deploy/**"] # deploy/<tenant>/<stage>/<version> → promote that env
  workflow_dispatch:
    inputs:
      environment:
        description: One target to deploy (e.g. csa-sbx). Blank = all push targets.
        default: ""

permissions:
  contents: read
  id-token: write # required for WIF

jobs:
  # ── Discover targets + changed services (once, shared by every matrix leg) ───
  discover:
    name: Discover deploy targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
      changes: ${{ steps.filter.outputs.changes }}
      # "true" on tag-promotion and manual runs → deploy ALL services regardless
      # of the change filter (a promotion ships the whole tagged commit).
      full: ${{ steps.pick.outputs.full }}
    steps:
      - uses: actions/checkout@v7

      # Which services' source changed since the previous commit. Computed ONCE
      # here so all matrix legs share one verdict. Tag promotions + manual runs
      # ignore it (discover sets full=true → every step deploys regardless).
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            gateway: ['services/backend/gateway/**']
            agents: ['services/backend/agents/**']
            mcp_stats: ['services/backend/mcp/stats/**']
            mcp_toolbox: ['services/backend/mcp/images/toolbox/**']
            sgtm: ['services/backend/tagging/sgtm/**']
            frontend: ['services/frontend/**', 'tenants/**']

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Every declared target → {tenant, stage, environment, branch}.
          all=$(jq -c '[.targets[] | . + {environment: (.tenant + "-" + .stage), branch: (.branch // "main")}]' \
            .github/deploy-targets.json)
          fail_empty() { # $1 = jq array, $2 = error message
            [ "$(printf '%s' "$1" | jq 'length')" != "0" ] || { echo "::error::$2"; exit 1; }
          }

          if [ -n "${DISPATCH_ENV:-}" ]; then
            # Manual single-environment deploy — must be a known target.
            sel=$(printf '%s' "$all" | jq -c --arg e "$DISPATCH_ENV" '[.[] | select(.environment == $e)]')
            fail_empty "$sel" "unknown environment '$DISPATCH_ENV' — not in .github/deploy-targets.json"
          elif [ "$REF_TYPE" = "tag" ]; then
            # Promotion tag deploy/<tenant>/<stage>[/<version>] → exactly that target.
            t=$(printf '%s' "$REF_NAME" | cut -d/ -f2)
            s=$(printf '%s' "$REF_NAME" | cut -d/ -f3)
            sel=$(printf '%s' "$all" | jq -c --arg t "$t" --arg s "$s" '[.[] | select(.tenant == $t and .stage == $s)]')
            fail_empty "$sel" "tag '$REF_NAME' → no target $t-$s (expected deploy/<tenant>/<stage>/<version>)"
          else
            # Branch push (or blank dispatch) → every trigger:push target on THIS branch.
            sel=$(printf '%s' "$all" | jq -c --arg b "$REF_NAME" '[.[] | select(.trigger == "push" and .branch == $b)]')
          fi

          # Tag promotions and manual runs deploy every service; branch pushes
          # honour the change filter.
          full=false
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ]; then full=true; fi

          {
            echo "matrix={\"include\":$sel}"
            echo "count=$(printf '%s' "$sel" | jq 'length')"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy targets (full=$full):"; printf '%s' "$sel" | jq -r '.[].environment' || true

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one tenant's failure must not cancel the others
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Scopes vars.* to THIS target's environment. Gated environments (required
    # reviewers) pause the run here until approved.
    environment: ${{ matrix.environment }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.DEPLOY_PROJECT }}
      AR: ${{ vars.ARTIFACT_REGISTRY }} # e.g. us-central1-docker.pkg.dev/<proj>/platform
      TENANT_ID: ${{ matrix.tenant }} # branding + enabled modules, baked into the FE image
      # Frontend image is per-ENVIRONMENT: it bakes this stack's Firebase app id
      # (+ tenant brand), which differ per stage — so the tag is <tenant>-<stage>.
      # Backend images are tenant/stage-agnostic (config comes from Cloud Run env),
      # tagged by SHA only and shared across every target.
      IMAGE_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      # ── Build + push (only changed services; gateway/agent use the prod stage) ─
      # Backend images are identical across targets. They're built per-leg for
      # correctness (each target may push to its own AR); the push is idempotent
      # on the shared-AR setup. Hoist to a shared job if all targets share one AR.
      - name: Build & push gateway
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'gateway') || needs.discover.outputs.full == 'true' }}
        run: |
          docker build --target prod -t "$AR/gateway:$SHA" services/backend/gateway
          docker push "$AR/gateway:$SHA"
      - name: Build & push agents
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'agents') || needs.discover.outputs.full == 'true' }}
        run: |
          docker build --target prod -t "$AR/agents:$SHA" services/backend/agents
          docker push "$AR/agents:$SHA"
      - name: Build & push mcp-stats
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'mcp_stats') || needs.discover.outputs.full == 'true' }}
        run: |
          docker build -t "$AR/mcp-stats:$SHA" services/backend/mcp/stats
          docker push "$AR/mcp-stats:$SHA"
      - name: Build & push mcp-toolbox
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'mcp_toolbox') || needs.discover.outputs.full == 'true' }}
        run: |
          docker build -t "$AR/mcp-toolbox:$SHA" services/backend/mcp/images/toolbox
          docker push "$AR/mcp-toolbox:$SHA"
      - name: Build & push sgtm
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'sgtm') || needs.discover.outputs.full == 'true' }}
        run: |
          # Google's gtm-cloud-image, snapshotted into our AR. Pushed regardless;
          # the deploy step below only rolls it if the service is provisioned.
          docker build -t "$AR/sgtm:$SHA" services/backend/tagging/sgtm
          docker push "$AR/sgtm:$SHA"
      - name: Build & push frontend
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'frontend') || needs.discover.outputs.full == 'true' }}
        run: |
          # NEXT_PUBLIC_* are inlined at build time. Public config from vars; the
          # API key from Secret Manager (ci-deployer has project secretAccessor).
          API_KEY="$(gcloud secrets versions access latest --secret=firebase-web-api-key --project="$PROJECT")"
          # The GA4 measurement id is baked per-tenant from tenants/<id>.json (via
          # NEXT_PUBLIC_TENANT) — NOT passed here, so a tenant can't emit into
          # another's property. Only the sGTM relay URL is env-driven (optional;
          # vars.NEXT_PUBLIC_GA_SERVER_CONTAINER_URL = the sgtm_url TF output).
          docker build --target runner \
            --build-arg NEXT_PUBLIC_TENANT="$TENANT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$PROJECT" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$PROJECT.firebaseapp.com" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$API_KEY" \
            --build-arg NEXT_PUBLIC_GA_SERVER_CONTAINER_URL="${{ vars.NEXT_PUBLIC_GA_SERVER_CONTAINER_URL }}" \
            -t "$AR/frontend:$IMAGE_ENV-$SHA" services/frontend
          docker push "$AR/frontend:$IMAGE_ENV-$SHA"

      # ── Migrate FIRST (only when the gateway/migrations changed) ─────────────
      - name: Run DB migrations
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'gateway') || needs.discover.outputs.full == 'true' }}
        run: |
          set -euo pipefail
          gcloud run jobs update "migrate" \
            --image "$AR/gateway:$SHA" --region "$REGION" --project "$PROJECT"
          gcloud run jobs execute "migrate" \
            --region "$REGION" --project "$PROJECT" --wait

      # ── Roll the changed services (private ones first, gateway last) ─────────
      # mcp-toolbox is module-gated in Terraform (tenants whose modules don't need
      # it — e.g. csa/analyze-only — have no such service), so guard like sgtm.
      - name: Deploy mcp-toolbox
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'mcp_toolbox') || needs.discover.outputs.full == 'true' }}
        run: |
          set -euo pipefail
          if gcloud run services describe "mcp-toolbox" --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud run deploy "mcp-toolbox" --image "$AR/mcp-toolbox:$SHA" --region "$REGION" --project "$PROJECT"
          else
            echo "mcp-toolbox not provisioned for this tenant (no enabling module) — skipping deploy"
          fi
      - name: Deploy agents
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'agents') || needs.discover.outputs.full == 'true' }}
        run: gcloud run deploy "agents" --image "$AR/agents:$SHA" --region "$REGION" --project "$PROJECT"
      - name: Deploy mcp-stats
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'mcp_stats') || needs.discover.outputs.full == 'true' }}
        run: gcloud run deploy "mcp-stats" --image "$AR/mcp-stats:$SHA" --region "$REGION" --project "$PROJECT"
      # sgtm is toggle-gated in Terraform (no service unless enable_sgtm = true)
      - name: Deploy sgtm
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'sgtm') || needs.discover.outputs.full == 'true' }}
        run: |
          set -euo pipefail
          if gcloud run services describe "sgtm" --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud run deploy "sgtm" --image "$AR/sgtm:$SHA" --region "$REGION" --project "$PROJECT"
          else
            echo "sgtm not provisioned (no CONTAINER_CONFIG / terraform apply) — skipping deploy"
          fi
      - name: Deploy gateway
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'gateway') || needs.discover.outputs.full == 'true' }}
        run: gcloud run deploy "gateway" --image "$AR/gateway:$SHA" --region "$REGION" --project "$PROJECT"
      - name: Deploy frontend
        if: ${{ contains(fromJSON(needs.discover.outputs.changes), 'frontend') || needs.discover.outputs.full == 'true' }}
        run: gcloud run deploy "frontend" --image "$AR/frontend:$IMAGE_ENV-$SHA" --region "$REGION" --project "$PROJECT"

      # ── Post-deploy smoke test ───────────────────────────────────────────────
      # Hits the public frontend on the request path — verifies the live state
      # even on a push that didn't roll a given service.
      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          FE="$(gcloud run services describe frontend --region "$REGION" --project "$PROJECT" --format='value(status.url)')"
          echo "Frontend ($IMAGE_ENV): $FE"

          echo "→ app reachable (production build + middleware)"
          # Tenant-agnostic: every tenant serves / and the login route. (No
          # per-tenant asset check — brand assets differ across tenants.)
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$FE/")"
          echo "  GET / -> $code"
          case "$code" in 2*|3*) ;; *) echo "::error::frontend not reachable ($code)"; exit 1 ;; esac

          echo "→ BFF → IAM token → gateway hop (unauthenticated /me must be a real 401)"
          # The body proves the request reached the gateway APP (its current_user
          # answered) — i.e. the whole BFF→token→gateway chain works. A 5xx, a
          # connect error, or a 401 with a DIFFERENT body = the hop is broken.
          resp="$(curl -sS -o /tmp/me.json -w '%{http_code}' "$FE/gw/api/v1/me" || echo 000)"
          echo "  GET /gw/api/v1/me -> $resp: $(cat /tmp/me.json 2>/dev/null)"
          if [ "$resp" = "401" ] && grep -q "authentication required" /tmp/me.json; then
            echo "✓ smoke test passed"
          else
            echo "::error::BFF→gateway hop unhealthy (got $resp; expected 401 'authentication required')"
            exit 1
          fi
