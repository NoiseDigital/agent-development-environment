name: CI

on:
  # PRs cover feature branches; push only on main (post-merge) — so a branch with
  # an open PR doesn't run CI twice.
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a new commit supersedes it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Discover tenants ──────────────────────────────────────────────────────
  # Emits the tenant list from tenants/*.json so the per-tenant matrices below
  # auto-cover every tenant — adding a tenant = drop a manifest, no CI edit.
  discover-tenants:
    name: Discover tenants
    runs-on: ubuntu-latest
    outputs:
      tenants: ${{ steps.list.outputs.tenants }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          t=$(for f in tenants/*.json; do
                b=$(basename "$f" .json)
                [ "$b" != modules ] && printf '%s\n' "$b"
              done | jq -R . | jq -sc .)
          echo "tenants=$t" >> "$GITHUB_OUTPUT"
          echo "tenants: $t"

  # ── Python backend lint + type check ──────────────────────────────────────
  backend-lint:
    name: Backend — ruff + mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend/agents

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install linting tools
        # Pin ruff to the SAME version as the pre-commit hook
        # (.pre-commit-config.yaml rev) so CI and local formatting can't drift —
        # an unpinned ruff floats and reformats differently, failing CI on
        # already-clean code. Syntax target is set in /ruff.toml (py313).
        run: pip install ruff==0.15.18 mypy

      - name: Install project dependencies
        run: pip install -e ".[dev]" --quiet || pip install -e . --quiet || true

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      # Uncomment when mypy stubs and type coverage improve:
      # - name: mypy
      #   run: mypy . --ignore-missing-imports --no-error-summary

  # ── Frontend lint ──────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — ESLint + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Tenant manifests must be internally consistent (modules/agents/services
      # exist, branding complete) before anything builds on them.
      - name: Lint tenant manifests
        run: node ../../scripts/lint-tenants.mjs

      # The frontend tenant config is generated from tenants/*.json (the canonical
      # manifests) into a committed file, since the Docker build can't read
      # repo-root manifests. Verify it's in sync — like a lockfile freshness check.
      - name: Tenant config is generated & committed
        run: |
          node ../../scripts/gen-tenant-config.mjs
          git diff --exit-code src/config/tenants.gen.ts \
            || { echo "::error::tenants.gen.ts is stale — run 'node scripts/gen-tenant-config.mjs' and commit it."; exit 1; }

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Vitest unit tests
        run: npm test

  # ── Per-tenant frontend build ─────────────────────────────────────────────
  # tsc/eslint/vitest run tenant-agnostic (default noise). A real production build
  # per tenant catches build-time breaks the typecheck can't — a branding value
  # that breaks the inline accent <style>, a module-gated import, a bad tenant.
  # Auto-covers new tenants via the discover job.
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    needs: discover-tenants
    strategy:
      matrix:
        tenant: ${{ fromJSON(needs.discover-tenants.outputs.tenants) }}
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tenant=${{ matrix.tenant }})
        run: NEXT_PUBLIC_TENANT=${{ matrix.tenant }} npm run build

  # ── Backend unit tests (agent harness + lib tests) ────────────────────────
  backend-test:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend/agents

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project + test deps
        # Editable install lets pytest resolve the `api`, `shared`, `adk_agents`
        # packages without a PYTHONPATH dance. `dev` dependencies live under
        # PEP 735 `[dependency-groups]`, so install pytest tooling explicitly.
        run: |
          pip install -e . --quiet
          pip install pytest pytest-asyncio pyyaml --quiet

      - name: pytest
        run: pytest -q

  # ── Schema discipline ─────────────────────────────────────────────────────
  # Two checks, both fast (no DB needed):
  #
  # 1. Forbid DDL outside the Alembic versions dir. The Alembic gateway is
  #    the only place a CREATE TABLE / ALTER TABLE may live; if someone
  #    reverts to inline ensure_schema() DDL in a repo file, fail the build.
  #
  # 2. PRs that touch a platform-owned repo (`services/backend/agents/api/*/repo.py`)
  #    must also add a new migration under `services/backend/gateway/alembic/versions/`.
  #    Catches "I changed how the row is shaped but forgot the migration."
  #
  # The actual `alembic upgrade head` check ran against a live Postgres was
  # noisy and slow; this pair gives the same coverage statically.
  schema-discipline:
    name: Schema — DDL discipline + migration parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the merge-base for the parity check below

      - name: Forbid DDL outside the Alembic versions dir
        # `grep -rn` exits non-zero (1) when no match — that's the success
        # case. We negate it: hits anywhere outside alembic/versions/ fail
        # the job. Tests + comments are excluded.
        run: |
          set -e
          if grep -rEn '\b(CREATE TABLE|ALTER TABLE|CREATE INDEX|DROP TABLE)\b' \
              --include='*.py' --include='*.sql' \
              services/backend \
              | grep -v 'services/backend/gateway/alembic/versions/' \
              | grep -v 'services/backend/database/init/' \
              | grep -v '^[^:]*:[[:space:]]*#'; then
            echo "::error::DDL found outside services/backend/gateway/alembic/versions/. Move it to a new Alembic migration."
            exit 1
          fi
          echo "ok — no inline DDL outside Alembic"

      - name: Require an Alembic migration when a repo changes
        # If any file under services/backend/agents/api/*/repo.py changed on
        # this branch but no new file was added under
        # services/backend/gateway/alembic/versions/, fail with a clear hint.
        # `pull_request` events have refs/remotes/origin/<base>; we diff
        # against it. On a direct push, we diff against HEAD^.
        env:
          # Pipe untrusted user input through the env so shell never sees it
          # inlined — see
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
            git fetch --depth=1 origin "$BASE_REF"
          else
            base="HEAD^"
          fi
          changed_repos=$(git diff --name-only "$base"...HEAD -- 'services/backend/agents/api/*/repo.py' || true)
          new_migrations=$(git diff --name-only --diff-filter=A "$base"...HEAD -- 'services/backend/gateway/alembic/versions/' || true)
          if [ -n "$changed_repos" ] && [ -z "$new_migrations" ]; then
            echo "::error::Repo files changed but no new Alembic migration was added."
            echo "Changed repos:"
            echo "$changed_repos"
            echo ""
            echo "If the schema changed, add a migration:"
            echo "  docker compose exec gateway uv run alembic revision -m \"short description\""
            echo "If the shape did NOT change, add a [skip-migration] tag to the PR title."
            case "$PR_TITLE" in
              *"[skip-migration]"*) echo "skip-migration tag present — allowing" ;;
              *) exit 1 ;;
            esac
          fi
          echo "ok — migration parity satisfied"

  # ── Terraform fmt + validate ───────────────────────────────────────────────
  terraform-check:
    name: Terraform — fmt + validate
    runs-on: ubuntu-latest
    needs: discover-tenants
    strategy:
      matrix:
        # Each tenant env calls module.tenant, so validating every tenant also
        # validates the module through its DIFFERENT module-enablement path (noise
        # deploys the toolbox, csa gates it off via count=0, exercising the [0]
        # refs). Auto-covers new tenants via the discover job.
        tenant: ${{ fromJSON(needs.discover-tenants.outputs.tenants) }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive

      # -backend=false skips the GCS backend; validate needs no var values.
      - name: terraform validate (${{ matrix.tenant }})
        working-directory: infra/tenants/${{ matrix.tenant }}
        run: |
          terraform init -backend=false
          terraform validate

  # ── Docker Compose config validation ──────────────────────────────────────
  compose-check:
    name: Docker Compose — config validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
