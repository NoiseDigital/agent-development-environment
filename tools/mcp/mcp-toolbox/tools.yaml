sources:
 my-bq-source:
   kind: bigquery
   project: nd-agentspace-sbx
## TODO: Rewrite toolset for Noise's media data model and to be better for visualizations
tools:
 search_release_notes_bq:
   kind: bigquery-sql
   source: my-bq-source
   statement: |
    SELECT
     product_name,description,published_at
    FROM
      `bigquery-public-data`.`google_cloud_release_notes`.`release_notes`
    WHERE
     DATE(published_at) >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
    GROUP BY product_name,description,published_at
    ORDER BY published_at DESC
   description: |
    Use this tool to get information on Google Cloud Release Notes.


 # Recharts-friendly visualization tools
 
 daily_spend_trend:
    kind: bigquery-sql
    source: my-bq-source
    parameters:
      - name: days_back
        type: string
        description: Number of days to look back (default 30)
      - name: campaign_phase_filter
        type: string
        description: Filter by campaign phase (optional)
    statement: |
      SELECT
        date_time as name,
        CAST(ROUND(SUM(total_spend), 2) AS FLOAT64) as total_spend,
      FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
      WHERE
        date_time >= DATE_SUB(CURRENT_DATE(), INTERVAL COALESCE(SAFE_CAST(@days_back AS INT64), 30) DAY)
        AND (@campaign_phase_filter IS NULL OR LOWER(campaign_phase) LIKE LOWER(CONCAT('%', trim(@campaign_phase_filter), '%')))
      GROUP BY date_time
      ORDER BY date_time
    description: |
      Returns daily spend trend in Recharts format with 'name' (date) and 'value' (spend) columns for line charts.
 
 
 publisher_spend_breakdown:
    kind: bigquery-sql
    source: my-bq-source
    parameters:
      - name: date_from
        type: string
        description: Start date (YYYY-MM-DD format, optional)
      - name: date_to
        type: string
        description: End date (YYYY-MM-DD format, optional)
    statement: |
      SELECT
        publisher as name,
        CAST(ROUND(SUM(total_spend), 2) AS FLOAT64) as total_spend,
      FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
      WHERE
        (NULLIF(@date_from, "") IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
        AND (NULLIF(@date_to, "") IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
      GROUP BY publisher
      ORDER BY total_spend DESC
      LIMIT 10
    description: |
      Returns publisher spend breakdown in Recharts format with 'name' (publisher) and 'value' (spend) for bar/pie charts.

 
 campaign_performance_comparison:
    kind: bigquery-sql
    source: my-bq-source
    parameters:
      - name: metric
        type: string
        description: Metric to compare (total_spend, impressions, clicks, completed_views, landing_page_views, engaged_visits)
      - name: date_from
        type: string
        description: Start date (YYYY-MM-DD format, optional)
      - name: date_to
        type: string
        description: End date (YYYY-MM-DD format, optional)
    statement: |
      SELECT
        campaign_phase as name,
        CASE
          WHEN @metric = "total_spend" THEN CAST(SUM(total_spend) AS FLOAT64)
          WHEN @metric = "impressions" THEN CAST(SUM(impressions) AS FLOAT64)
          WHEN @metric = "clicks" THEN CAST(SUM(clicks) AS FLOAT64)
          WHEN @metric = "completed_views" THEN CAST(SUM(completed_views) AS FLOAT64)
          WHEN @metric = "landing_page_views" THEN CAST(SUM(landing_page_views) AS FLOAT64)
          WHEN @metric = "engaged_visits" THEN CAST(SUM(engaged_visits) AS FLOAT64)
          ELSE 0
      END as value
      FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
      WHERE
        (NULLIF(@date_from, "") IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
        AND (NULLIF(@date_to, "") IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
        AND campaign_phase IS NOT NULL
      GROUP BY campaign_phase
      ORDER BY value DESC
      LIMIT 10
    description: |
      Returns campaign phase performance comparison in Recharts format with 'name' (campaign) and 'value' (selected metric).
 
 
 platform_engagement_metrics:
    kind: bigquery-sql
    source: my-bq-source
    parameters:
      - name: date_from
        type: string
        description: Start date (YYYY-MM-DD format, optional)
      - name: date_to
        type: string
        description: End date (YYYY-MM-DD format, optional)
    statement: |
      SELECT
        platform as name,
        CAST(
          ROUND(
            COALESCE(SAFE_DIVIDE(SUM(clicks), SUM(impressions)), 0),
            4
          ) as FLOAT64
        ) as value
      FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
      WHERE
        (NULLIF(@date_from, "") IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
        AND (NULLIF(@date_to, "") IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
        AND platform IS NOT NULL
      GROUP BY platform
      ORDER BY value DESC
      LIMIT 10
    description: |
      Returns platform click-through rates in Recharts format with 'name' (platform) and 'value' (CTR %) for comparison charts.

 
 weekly_performance_trend:
    kind: bigquery-sql
    source: my-bq-source
    parameters:
      - name: weeks_back
        type: string
        description: Number of weeks to look back (default 12)
      - name: metric
        type: string
        description: Metric to trend (total_spend (default), impressions, clicks, completed_views, landing_page_views, engaged_visits)
    statement: |
      SELECT
        FORMAT_DATE('%Y-W%U', date_time) as name,
        CASE
          WHEN @metric = "total_spend" THEN CAST(SUM(total_spend) AS FLOAT64)
          WHEN @metric = "impressions" THEN CAST(SUM(impressions) AS FLOAT64)
          WHEN @metric = "clicks" THEN CAST(SUM(clicks) AS FLOAT64)
          WHEN @metric = "completed_views" THEN CAST(SUM(completed_views) AS FLOAT64)
          WHEN @metric = "landing_page_views" THEN CAST(SUM(landing_page_views) AS FLOAT64)
          WHEN @metric = "engaged_visits" THEN CAST(SUM(engaged_visits) AS FLOAT64)
          ELSE 0
        END as value
      FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
      WHERE
        date_time >= DATE_SUB(CURRENT_DATE(), INTERVAL (COALESCE(SAFE_CAST(@weeks_back AS INT64), 12) *7) DAY)
      GROUP BY FORMAT_DATE('%Y-W%U', date_time)
      ORDER BY name
    description: |
      Returns weekly performance trend in Recharts format with 'name' (week) and 'value' (selected metric) for line charts.
 
 
 top_performing_campaigns:
    kind: bigquery-sql
    source: my-bq-source
    parameters:
      - name: metric
        type: string
        description: Metric to trend (total_spend (default), impressions, clicks, completed_views, landing_page_views, engaged_visits)
      - name: limit_rows
        type: string
        description: Number of top campaigns to return (default 10)
      - name: date_from
        type: string
        description: Start date (YYYY-MM-DD format, optional)
      - name: date_to
        type: string
        description: End date (YYYY-MM-DD format, optional)
    statement: |
      WITH CalculatedValue AS (
        SELECT
          campaign || " - " || publisher as name,
          CASE
            WHEN @metric = "total_spend" THEN CAST(SUM(total_spend) AS FLOAT64)
            WHEN @metric = "impressions" THEN CAST(SUM(impressions) AS FLOAT64)
            WHEN @metric = "clicks" THEN CAST(SUM(clicks) AS FLOAT64)
            WHEN @metric = "completed_views" THEN CAST(SUM(completed_views) AS FLOAT64)
            WHEN @metric = "landing_page_views" THEN CAST(SUM(landing_page_views) AS FLOAT64)
            WHEN @metric = "engaged_visits" THEN CAST(SUM(engaged_visits) AS FLOAT64)
            ELSE 0
          END as value
        FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
        WHERE
          (NULLIF(@date_from, "") IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
          AND (NULLIF(@date_to, "") IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
          AND campaign IS NOT NULL
          AND publisher IS NOT NULL
        GROUP BY campaign, publisher
      ),

      RankedResults AS (
        SELECT
          name,
          value,
          -- Now we can simply ORDER BY the 'value' alias
          ROW_NUMBER() OVER(ORDER BY value DESC) as rn
        FROM CalculatedValue
      )

      SELECT
        name,
        value
      FROM RankedResults
      WHERE
        rn <= COALESCE(SAFE_CAST(@limit_rows AS INT64), 10)
      ORDER BY value DESC
    description: |
      Returns top performing campaigns in Recharts format with 'name' (campaign + publisher) and 'value' (selected metric).


 conversion_funnel_data:
    kind: bigquery-sql
    source: my-bq-source
    parameters:
      - name: campaign_phase_filter
        type: string
        description: Filter by campaign phase (optional)
      - name: date_from
        type: string
        description: Start date (YYYY-MM-DD format, optional)
      - name: date_to
        type: string
        description: End date (YYYY-MM-DD format, optional)
    statement: |
      WITH funnel_data AS (
        SELECT
          SUM(impressions) as impressions,
          SUM(clicks) as clicks,
          SUM(landing_page_views) as landing_page_views,
          SUM(completed_views) as completed_views,
          SUM(total_spend) as total_spend,
          SUM(engaged_visits) as engaged_visits
        FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
        WHERE
          (NULLIF(@date_from, "") IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
          AND (NULLIF(@date_to, "") IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
          AND (@campaign_phase_filter IS NULL OR LOWER(campaign_phase) LIKE LOWER(CONCAT('%', trim(@campaign_phase_filter), '%')))
      )
      -- Final SELECT: Unpivot the data and map to friendly names
      SELECT
        -- Map the raw column name to a friendly 'name'
        CASE name
          WHEN 'impressions' THEN 'Impressions'
          WHEN 'clicks' THEN 'Clicks'
          WHEN 'landing_page_views' THEN 'Landing Page Views'
          WHEN 'completed_views' THEN 'Completed Views'
          WHEN 'total_spend' THEN 'Total Spend'
          WHEN 'engaged_visits' THEN 'Engaged Visits'
        END as name,
        ROUND(SAFE_CAST( value AS FLOAT64),2) as value
      FROM funnel_data
      -- UNPIVOT turns columns into rows
      UNPIVOT(value FOR name IN (
          impressions,
          clicks,
          landing_page_views,
          completed_views,
          total_spend,
          engaged_visits
        )
      )
      ORDER BY name ASC
    description: |
      Returns conversion funnel data in Recharts format with 'name' (funnel stage) and 'value' (count) for funnel visualization.

toolsets:
 public_bq_toolset:
   - search_release_notes_bq
 media_performance_recharts_friendly:
   - daily_spend_trend
   - publisher_spend_breakdown
   - campaign_performance_comparison
   - platform_engagement_metrics
   - weekly_performance_trend
   - top_performing_campaigns
   - conversion_funnel_data
