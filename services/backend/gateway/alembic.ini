# Alembic config — the gateway owns the platform's Postgres schema.
#
# Migrations target every table the platform created (session_metadata,
# event_metadata, sources, future ones). ADK manages its own tables and ships
# its own migrations; nothing here touches those.
#
# The DATABASE_URL is read at runtime from the environment (see alembic/env.py),
# so the same migration set runs cleanly in dev (compose), CI (fresh Postgres),
# and prod (managed Postgres) without per-environment config files.

[alembic]
script_location = alembic
prepend_sys_path = .
# UTC timestamps in generated revision filenames — readable, sortable, and
# tz-stable across contributors.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is intentionally blank; env.py reads DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
