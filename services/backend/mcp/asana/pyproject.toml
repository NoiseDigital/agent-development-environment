[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-asana"
version = "0.1.0"
description = "MCP service for Asana tools"
requires-python = "==3.13.*"
dependencies = [
    "mcp==1.27.0",
    "starlette>=0.49.1,<1",
    "uvicorn==0.46.0",
    "google-adk==1.32.0",
    "python-dotenv>=1.0.0",
]
