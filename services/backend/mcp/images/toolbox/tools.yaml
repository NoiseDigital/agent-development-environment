kind: tool
name: breakdown_nested_totals
type: bigquery-sql
source: my-bq-source
parameters:
  - name: outer_dim
    type: string
    description: Outer grouping dimension (publisher, platform, campaign_phase, campaign, market_group, creative_format, kpi_goal).
    required: true
  - name: inner_dim
    type: string
    description: Inner grouping dimension (same allowlist as outer_dim, or empty string for a single-level grouping by outer_dim only).
    required: false
    default: ""
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Empty = no filter.
    required: false
    default: ""
  - name: publisher_filter
    type: string
    description: Filter by publisher. Empty = no filter.
    required: false
    default: ""
  - name: market_group_filter
    type: string
    description: Filter by market group. Empty = no filter.
    required: false
    default: ""
  - name: creative_format_filter
    type: string
    description: Filter by creative format. Empty = no filter.
    required: false
    default: ""
  - name: kpi_goal_filter
    type: string
    description: Filter by KPI goal. Empty = no filter.
    required: false
    default: ""
statement: |
  -- Multi-metric breakdown: every aggregate the KPI strip cares about, grouped
  -- by (outer, inner). One BQ call replaces what would otherwise be six
  -- breakdown_nested calls (one per metric) — the pivot table fans out from
  -- this single row set. inner_dim may be empty for a single-level grouping.
  SELECT
    CASE @outer_dim
      WHEN 'publisher' THEN publisher
      WHEN 'platform' THEN platform
      WHEN 'campaign_phase' THEN campaign_phase
      WHEN 'campaign' THEN campaign
      WHEN 'market_group' THEN market_group
      WHEN 'creative_format' THEN creative_format
      WHEN 'kpi_goal' THEN kpi_goal
    END AS outer_name,
    CASE @inner_dim
      WHEN '' THEN ''
      WHEN 'publisher' THEN publisher
      WHEN 'platform' THEN platform
      WHEN 'campaign_phase' THEN campaign_phase
      WHEN 'campaign' THEN campaign
      WHEN 'market_group' THEN market_group
      WHEN 'creative_format' THEN creative_format
      WHEN 'kpi_goal' THEN kpi_goal
    END AS inner_name,
    CAST(SUM(total_spend) AS FLOAT64) AS total_spend,
    CAST(SUM(impressions) AS FLOAT64) AS impressions,
    CAST(SUM(clicks) AS FLOAT64) AS clicks,
    CAST(SUM(landing_page_views) AS FLOAT64) AS landing_page_views,
    CAST(SUM(engaged_visits) AS FLOAT64) AS engaged_visits,
    CAST(SUM(completed_views) AS FLOAT64) AS completed_views,
    -- Rate columns cast to FLOAT64 — see the metric_totals tool above for
    -- the full reasoning. Required for the frontend pivot to consume them
    -- as numbers without per-cell string-coercion guards.
    CAST(SAFE_DIVIDE(SUM(clicks), NULLIF(SUM(impressions), 0)) AS FLOAT64) AS ctr,
    CAST(SAFE_DIVIDE(SUM(engaged_visits), NULLIF(SUM(clicks), 0)) AS FLOAT64) AS cvr,
    CAST(SAFE_DIVIDE(SUM(total_spend) * 1000, NULLIF(SUM(impressions), 0)) AS FLOAT64) AS cpm,
    CAST(SAFE_DIVIDE(SUM(total_spend), NULLIF(SUM(clicks), 0)) AS FLOAT64) AS cpc,
    CAST(SAFE_DIVIDE(SUM(total_spend), NULLIF(SUM(engaged_visits), 0)) AS FLOAT64) AS cpa,
    CAST(SAFE_DIVIDE(SUM(completed_views), NULLIF(SUM(impressions), 0)) AS FLOAT64) AS vcr
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
    AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
    AND (@publisher_filter = ''       OR LOWER(publisher)       IN UNNEST(SPLIT(LOWER(@publisher_filter), '|')))
    AND (@market_group_filter = ''    OR LOWER(market_group)    IN UNNEST(SPLIT(LOWER(@market_group_filter), '|')))
    AND (@creative_format_filter = '' OR LOWER(creative_format) IN UNNEST(SPLIT(LOWER(@creative_format_filter), '|')))
    AND (@kpi_goal_filter = ''        OR LOWER(kpi_goal)        IN UNNEST(SPLIT(LOWER(@kpi_goal_filter), '|')))
  GROUP BY outer_name, inner_name
  HAVING outer_name IS NOT NULL AND (@inner_dim = '' OR inner_name IS NOT NULL)
  ORDER BY outer_name, total_spend DESC
description: |
  Multi-metric two-level breakdown: returns one row per (outer_name, inner_name)
  pair (or per outer_name when inner_dim is empty) with every aggregate +
  derived rate that the KPI strip uses. Drives the pivot table. Dimensions
  allowlisted: publisher, platform, campaign_phase, market_group,
  creative_format, kpi_goal.
