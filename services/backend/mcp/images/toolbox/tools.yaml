kind: tool
name: publisher_spend_breakdown
type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  SELECT
    publisher as name,
    CAST(SUM(spend) AS FLOAT64) as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance`
  WHERE
    (@date_from IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
    AND (@date_to IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
  GROUP BY publisher
  ORDER BY value DESC
  LIMIT 10
description: |
  Returns publisher spend breakdown in Recharts format with 'name' (publisher) and 'value' (spend) for bar/pie charts.
---
kind: tool
name: campaign_performance_comparison
type: bigquery-sql
source: my-bq-source
parameters:
  - name: metric
    type: string
    description: Metric to compare (spend, impressions, clicks, landing_page_views). Defaults to spend.
    required: false
    default: spend
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  SELECT
    campaign_phase as name,
    CASE @metric
      WHEN 'spend' THEN CAST(SUM(spend) AS FLOAT64)
      WHEN 'impressions' THEN CAST(SUM(impressions) AS FLOAT64)
      WHEN 'clicks' THEN CAST(SUM(clicks) AS FLOAT64)
      WHEN 'landing_page_views' THEN CAST(SUM(landing_page_views) AS FLOAT64)
      ELSE CAST(SUM(spend) AS FLOAT64)
    END as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance`
  WHERE
    (@date_from IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
    AND (@date_to IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
    AND campaign_phase IS NOT NULL
  GROUP BY campaign_phase
  ORDER BY value DESC
  LIMIT 10
description: |
  Returns campaign phase performance comparison in Recharts format with 'name' (campaign) and 'value' (selected metric).
---
kind: tool
name: platform_engagement_metrics
type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  SELECT
    platform as name,
    SAFE_DIVIDE(SUM(clicks), NULLIF(SUM(impressions), 0)) * 100 as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance`
  WHERE
    (@date_from IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
    AND (@date_to IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
    AND platform IS NOT NULL
  GROUP BY platform
  HAVING SUM(impressions) > 0
  ORDER BY value DESC
  LIMIT 10
description: |
  Returns platform click-through rates in Recharts format with 'name' (platform) and 'value' (CTR %) for comparison charts.
---
kind: tool
name: top_performing_campaigns
type: bigquery-sql
source: my-bq-source
parameters:
  - name: metric
    type: string
    description: Metric to rank by (spend, impressions, clicks, landing_page_views). Defaults to spend.
    required: false
    default: spend
  - name: limit_rows
    type: integer
    description: Number of top campaigns to return (default 10)
    required: false
    default: 10
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  SELECT
    CONCAT(campaign_phase, ' (', publisher, ')') as name,
    CASE @metric
      WHEN 'spend' THEN CAST(SUM(spend) AS FLOAT64)
      WHEN 'impressions' THEN CAST(SUM(impressions) AS FLOAT64)
      WHEN 'clicks' THEN CAST(SUM(clicks) AS FLOAT64)
      WHEN 'landing_page_views' THEN CAST(SUM(landing_page_views) AS FLOAT64)
      ELSE CAST(SUM(spend) AS FLOAT64)
    END as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance`
  WHERE
    (@date_from IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
    AND (@date_to IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
    AND campaign_phase IS NOT NULL
    AND publisher IS NOT NULL
  GROUP BY campaign_phase, publisher
  ORDER BY value DESC
  LIMIT @limit_rows
description: |
  Returns top performing campaigns in Recharts format with 'name' (campaign + publisher) and 'value' (selected metric).
---
kind: tool
name: conversion_funnel_data
type: bigquery-sql
source: my-bq-source
parameters:
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Omit (empty) for no filter.
    required: false
    default: ""
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  WITH funnel_data AS (
    SELECT
      SUM(impressions) as impressions,
      SUM(clicks) as clicks,
      SUM(landing_page_views) as landing_page_views,
      SUM(brochure_views) as brochure_views,
      SUM(completed_views) as completed_views,
      SUM(application_page_view) as applications
    FROM `nd-agentspace-sbx.media_performance.media_campaign_performance`
    WHERE
      (@date_from IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
      AND (@date_to IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
      AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) LIKE LOWER(CONCAT('%', @campaign_phase_filter, '%')))
  )
  SELECT 'Impressions' as name, impressions as value FROM funnel_data
  UNION ALL SELECT 'Clicks' as name, clicks as value FROM funnel_data
  UNION ALL SELECT 'Landing Page Views' as name, landing_page_views as value FROM funnel_data
  UNION ALL SELECT 'Brochure Views' as name, brochure_views as value FROM funnel_data
  UNION ALL SELECT 'Completed Views' as name, completed_views as value FROM funnel_data
  UNION ALL SELECT 'Applications' as name, applications as value FROM funnel_data
  ORDER BY value DESC
description: |
  Returns conversion funnel data in Recharts format with 'name' (funnel stage) and 'value' (count) for funnel visualization.
---
kind: tool
name: available_date_range
type: bigquery-sql
source: my-bq-source
statement: |
  SELECT
    FORMAT_DATE('%Y-%m-%d', DATE(MIN(date_time))) AS earliest_date,
    FORMAT_DATE('%Y-%m-%d', DATE(MAX(date_time))) AS latest_date,
    COUNT(DISTINCT DATE(date_time)) AS distinct_days
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance`
description: |
  Returns the date range available in the media performance data: earliest_date,
  latest_date and distinct_days. Call this before asking the user to clarify a
  time period, so the options offered are grounded in the real available dates.
