type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date (YYYY-MM-DD). Omit for full history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date (YYYY-MM-DD). Omit for full history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
