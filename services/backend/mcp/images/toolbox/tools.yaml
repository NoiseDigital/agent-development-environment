# The canonical media-performance toolset. Loaded by both the root agent and
# the ChoicesAgent — they need the same data surface (the root queries it for
# answers; ChoicesAgent calls `available_date_range`, `publisher_spend_breakdown`,
# etc. to ground its multiple-choice options in REAL values).
kind: toolset
name: media_performance_query
tools:
  - performance_trend
  - publisher_spend_breakdown
  - campaign_performance_comparison
  - platform_engagement_metrics
  - top_performing_campaigns
  - conversion_funnel_data
  - market_group_breakdown
  - creative_format_breakdown
  - kpi_goal_breakdown
  - budget_pacing
  - period_over_period
  - metric_totals
  - metric_series
  - breakdown_nested
  - breakdown_nested_totals
  - dimension_values
  - available_date_range
  - campaign_windows
