      WHEN 'completed_views' THEN CAST(SUM(completed_views) AS FLOAT64)
      ELSE CAST(SUM(total_spend) AS FLOAT64)
    END as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
    AND kpi_goal IS NOT NULL
    AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
    AND (@publisher_filter = ''       OR LOWER(publisher)       IN UNNEST(SPLIT(LOWER(@publisher_filter), '|')))
    AND (@market_group_filter = ''    OR LOWER(market_group)    IN UNNEST(SPLIT(LOWER(@market_group_filter), '|')))
    AND (@creative_format_filter = '' OR LOWER(creative_format) IN UNNEST(SPLIT(LOWER(@creative_format_filter), '|')))
    AND (@kpi_goal_filter = ''        OR LOWER(kpi_goal)        IN UNNEST(SPLIT(LOWER(@kpi_goal_filter), '|')))
  GROUP BY kpi_goal
  ORDER BY value DESC
description: |
  Returns KPI-goal (Awareness / Consideration / Conversion / etc.) breakdown in
  chart-ready format with 'name' (kpi_goal) and 'value' (selected metric).
---
kind: tool
name: budget_pacing
type: bigquery-sql
source: my-bq-source
parameters:
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Omit (empty) for no filter.
    required: false
    default: ""
statement: |
  -- Pacing = spent vs. planned. The schema carries per-row `budget` (the
  -- plan) and `total_spend` (actual delivery); the difference is pace.
  WITH t AS (
    SELECT
      SUM(budget) AS budget,
      SUM(total_spend) AS spent
    FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
    WHERE (@campaign_phase_filter = ''
           OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
  )
  SELECT 'Budget' AS name, CAST(budget AS FLOAT64) AS value, 0 AS stage_order FROM t UNION ALL
  SELECT 'Spent'  AS name, CAST(spent  AS FLOAT64) AS value, 1 AS stage_order FROM t
  ORDER BY stage_order
description: |
  Returns planned budget vs. actual spend in chart-ready format: two rows with
  'name' (Budget / Spent) and 'value'. Plot as a bar to read pacing at a glance.
---
kind: tool
name: period_over_period
type: bigquery-sql
source: my-bq-source
parameters:
  - name: metric
    type: string
    description: Metric to compare (total_spend, impressions, clicks, landing_page_views, engaged_visits, completed_views). Defaults to total_spend.
    required: false
    default: total_spend
  - name: current_from
    type: string
    description: Current-period start (YYYY-MM-DD).
    required: true
  - name: current_to
    type: string
    description: Current-period end (YYYY-MM-DD).
    required: true
  - name: prior_from
    type: string
    description: Prior-period start (YYYY-MM-DD).
    required: true
  - name: prior_to
    type: string
    description: Prior-period end (YYYY-MM-DD).
    required: true
statement: |
  -- Two parallel sums, one per window, then a single row with absolute and
  -- percentage deltas. Chart-ready as a side-by-side bar (`name` = Prior /
  -- Current) by selecting just those two cells; the deltas in the same row
  -- save the agent a calculation.
  WITH cur AS (
    SELECT
      CASE @metric
        WHEN 'total_spend' THEN CAST(SUM(total_spend) AS FLOAT64)
        WHEN 'impressions' THEN CAST(SUM(impressions) AS FLOAT64)
        WHEN 'clicks' THEN CAST(SUM(clicks) AS FLOAT64)
        WHEN 'landing_page_views' THEN CAST(SUM(landing_page_views) AS FLOAT64)
        WHEN 'engaged_visits' THEN CAST(SUM(engaged_visits) AS FLOAT64)
        WHEN 'completed_views' THEN CAST(SUM(completed_views) AS FLOAT64)
        ELSE CAST(SUM(total_spend) AS FLOAT64)
      END AS value
    FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
    WHERE date_time >= PARSE_DATE('%Y-%m-%d', @current_from)
      AND date_time <= PARSE_DATE('%Y-%m-%d', @current_to)
  ),
  pri AS (
    SELECT
      CASE @metric
        WHEN 'total_spend' THEN CAST(SUM(total_spend) AS FLOAT64)
        WHEN 'impressions' THEN CAST(SUM(impressions) AS FLOAT64)
        WHEN 'clicks' THEN CAST(SUM(clicks) AS FLOAT64)
        WHEN 'landing_page_views' THEN CAST(SUM(landing_page_views) AS FLOAT64)
        WHEN 'engaged_visits' THEN CAST(SUM(engaged_visits) AS FLOAT64)
        WHEN 'completed_views' THEN CAST(SUM(completed_views) AS FLOAT64)
        ELSE CAST(SUM(total_spend) AS FLOAT64)
      END AS value
    FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
    WHERE date_time >= PARSE_DATE('%Y-%m-%d', @prior_from)
      AND date_time <= PARSE_DATE('%Y-%m-%d', @prior_to)
  )
  SELECT 'Prior'   AS name, pri.value AS value, 0 AS stage_order, pri.value AS prior, cur.value AS current,
         (cur.value - pri.value) AS delta,
         SAFE_DIVIDE(cur.value - pri.value, NULLIF(pri.value, 0)) AS pct_change
    FROM cur, pri
  UNION ALL
  SELECT 'Current' AS name, cur.value AS value, 1 AS stage_order, pri.value AS prior, cur.value AS current,
         (cur.value - pri.value) AS delta,
         SAFE_DIVIDE(cur.value - pri.value, NULLIF(pri.value, 0)) AS pct_change
    FROM cur, pri
  ORDER BY stage_order
description: |
  Period-over-period (PoP) comparison for one metric — returns two rows with
  'name' (Prior / Current) and 'value' for a side-by-side bar, plus per-row
  'delta' and 'pct_change' so the narrative can quote the lift without recomputing.
  Use for any "vs. last month / last year / prior period" question.
---
kind: tool
name: metric_totals
type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Omit (empty) for no filter.
    required: false
    default: ""
  - name: publisher_filter
    type: string
    description: Filter by publisher (substring match, case-insensitive). Empty = no filter.
    required: false
    default: ""
  - name: market_group_filter
    type: string
    description: Filter by market group (substring match). Empty = no filter.
    required: false
    default: ""
  - name: creative_format_filter
    type: string
    description: Filter by creative format (substring match). Empty = no filter.
    required: false
    default: ""
  - name: kpi_goal_filter
    type: string
    description: Filter by KPI goal (substring match). Empty = no filter.
    required: false
    default: ""
statement: |
  -- One row of every aggregate the KPI strip cares about, plus the derived
  -- rates (CTR / CVR / CPM / CPC / CPA / VCR). The agent and the dashboard
  -- both consume this; both get identical numbers because the SQL is shared.
  SELECT
    CAST(SUM(total_spend) AS FLOAT64) AS total_spend,
    CAST(SUM(impressions) AS FLOAT64) AS impressions,
    CAST(SUM(clicks) AS FLOAT64) AS clicks,
    CAST(SUM(landing_page_views) AS FLOAT64) AS landing_page_views,
    CAST(SUM(engaged_visits) AS FLOAT64) AS engaged_visits,
    CAST(SUM(completed_views) AS FLOAT64) AS completed_views,
    CAST(SUM(budget) AS FLOAT64) AS budget,
    -- SAFE_DIVIDE returns NUMERIC; BigQuery serialises NUMERIC as a JSON
    -- STRING to preserve precision. The frontend's KPI / pivot / narrative
    -- tiles call `.toFixed()` on these values, so they must arrive as
    -- numbers. CAST to FLOAT64 here forces the JSON encoder to emit a
    -- number — applies to every rate column.
    CAST(SAFE_DIVIDE(SUM(clicks), NULLIF(SUM(impressions), 0)) AS FLOAT64) AS ctr,
    CAST(SAFE_DIVIDE(SUM(engaged_visits), NULLIF(SUM(clicks), 0)) AS FLOAT64) AS cvr,
    CAST(SAFE_DIVIDE(SUM(total_spend) * 1000, NULLIF(SUM(impressions), 0)) AS FLOAT64) AS cpm,
    CAST(SAFE_DIVIDE(SUM(total_spend), NULLIF(SUM(clicks), 0)) AS FLOAT64) AS cpc,
    CAST(SAFE_DIVIDE(SUM(total_spend), NULLIF(SUM(engaged_visits), 0)) AS FLOAT64) AS cpa,
    CAST(SAFE_DIVIDE(SUM(completed_views), NULLIF(SUM(impressions), 0)) AS FLOAT64) AS vcr
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
    AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
    AND (@publisher_filter = ''       OR LOWER(publisher)       IN UNNEST(SPLIT(LOWER(@publisher_filter), '|')))
    AND (@market_group_filter = ''    OR LOWER(market_group)    IN UNNEST(SPLIT(LOWER(@market_group_filter), '|')))
    AND (@creative_format_filter = '' OR LOWER(creative_format) IN UNNEST(SPLIT(LOWER(@creative_format_filter), '|')))
    AND (@kpi_goal_filter = ''        OR LOWER(kpi_goal)        IN UNNEST(SPLIT(LOWER(@kpi_goal_filter), '|')))
description: |
  Returns a single row of all key aggregates + derived rates for the requested
  window — total_spend, impressions, clicks, landing_page_views, engaged_visits,
  completed_views, budget, ctr, cvr, cpm, cpc, cpa, vcr. Drives the KPI strip
  and any "what did we do overall in this window?" style summary.
---
kind: tool
name: breakdown_nested
type: bigquery-sql
source: my-bq-source
parameters:
  - name: outer_dim
    type: string
    description: Outer grouping dimension (publisher, platform, campaign_phase, market_group, creative_format, kpi_goal).
    required: true
  - name: inner_dim
    type: string
    description: Inner grouping dimension (same allowlist as outer_dim).
    required: true
  - name: metric
    type: string
    description: Metric to aggregate (total_spend, impressions, clicks, landing_page_views, engaged_visits, completed_views). Defaults to total_spend.
    required: false
    default: total_spend
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  -- Two-level grouping for pivot tables (e.g. Market Group → Market, or
  -- Campaign Phase → Publisher). Returns one row per (outer, inner) pair with
  -- the chosen metric aggregated. The CASE-on-string for the dimensions is
  -- the bigquery-sql idiom for "switch by parameter" since toolbox can't
  -- template column names — only the allowlisted dimensions reach SQL.
  SELECT
    CASE @outer_dim
      WHEN 'publisher' THEN publisher
      WHEN 'platform' THEN platform
      WHEN 'campaign_phase' THEN campaign_phase
      WHEN 'market_group' THEN market_group
      WHEN 'creative_format' THEN creative_format
      WHEN 'kpi_goal' THEN kpi_goal
    END AS outer_name,
    CASE @inner_dim
      WHEN 'publisher' THEN publisher
      WHEN 'platform' THEN platform
      WHEN 'campaign_phase' THEN campaign_phase
      WHEN 'market_group' THEN market_group
      WHEN 'creative_format' THEN creative_format
      WHEN 'kpi_goal' THEN kpi_goal
    END AS inner_name,
    CASE @metric
      WHEN 'total_spend' THEN CAST(SUM(total_spend) AS FLOAT64)
      WHEN 'impressions' THEN CAST(SUM(impressions) AS FLOAT64)
      WHEN 'clicks' THEN CAST(SUM(clicks) AS FLOAT64)
      WHEN 'landing_page_views' THEN CAST(SUM(landing_page_views) AS FLOAT64)
      WHEN 'engaged_visits' THEN CAST(SUM(engaged_visits) AS FLOAT64)
      WHEN 'completed_views' THEN CAST(SUM(completed_views) AS FLOAT64)
      ELSE CAST(SUM(total_spend) AS FLOAT64)
    END AS value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
  GROUP BY outer_name, inner_name
  HAVING outer_name IS NOT NULL AND inner_name IS NOT NULL
  ORDER BY outer_name, value DESC
description: |
  Two-level grouping for a pivot table or grouped bar — returns rows of
  'outer_name', 'inner_name', and 'value' (the chosen metric). Use when the
  user asks for one dimension nested under another, e.g. "publisher within
  campaign phase" or "platform within market group". Both dimensions must be
  one of: publisher, platform, campaign_phase, market_group, creative_format,
  kpi_goal.
