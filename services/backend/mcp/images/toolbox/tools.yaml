    required: false
    default: ""
  - name: market_group_filter
    type: string
    description: Filter by market group. Empty = no filter.
    required: false
    default: ""
  - name: creative_format_filter
    type: string
    description: Filter by creative format. Empty = no filter.
    required: false
    default: ""
  - name: kpi_goal_filter
    type: string
    description: Filter by KPI goal. Empty = no filter.
    required: false
    default: ""
statement: |
  SELECT
    platform as name,
    SAFE_DIVIDE(SUM(clicks), NULLIF(SUM(impressions), 0)) * 100 as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
    AND platform IS NOT NULL
    AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
    AND (@publisher_filter = ''       OR LOWER(publisher)       IN UNNEST(SPLIT(LOWER(@publisher_filter), '|')))
    AND (@market_group_filter = ''    OR LOWER(market_group)    IN UNNEST(SPLIT(LOWER(@market_group_filter), '|')))
    AND (@creative_format_filter = '' OR LOWER(creative_format) IN UNNEST(SPLIT(LOWER(@creative_format_filter), '|')))
    AND (@kpi_goal_filter = ''        OR LOWER(kpi_goal)        IN UNNEST(SPLIT(LOWER(@kpi_goal_filter), '|')))
  GROUP BY platform
  HAVING SUM(impressions) > 0
  ORDER BY value DESC
  LIMIT 10
description: |
  Returns platform click-through rates in chart-ready format with 'name' (platform) and 'value' (CTR %) for comparison charts.
