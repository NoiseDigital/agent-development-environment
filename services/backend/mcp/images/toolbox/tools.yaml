kind: tool
name: conversion_funnel_data
type: bigquery-sql
source: my-bq-source
parameters:
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Omit (empty) for no filter.
    required: false
    default: ""
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  -- Funnel stages live in this schema as parallel counters; we unpivot the
  -- single totals row into one stage per output row, keeping a stable order
  -- so the funnel chart can sort by it. Impressions → Clicks → Landing-page
  -- views → Engaged visits is the canonical drop-off path on this dataset.
  WITH totals AS (
    SELECT
      SUM(impressions) AS impressions,
      SUM(clicks) AS clicks,
      SUM(landing_page_views) AS landing_page_views,
      SUM(engaged_visits) AS engaged_visits
    FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
    WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
      AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
      AND (@campaign_phase_filter = ''
           OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
  )
  SELECT 'Impressions'         AS name, impressions          AS value, 0 AS stage_order FROM totals UNION ALL
  SELECT 'Clicks'               AS name, clicks               AS value, 1 AS stage_order FROM totals UNION ALL
  SELECT 'Landing Page Views'   AS name, landing_page_views   AS value, 2 AS stage_order FROM totals UNION ALL
  SELECT 'Engaged Visits'       AS name, engaged_visits       AS value, 3 AS stage_order FROM totals
  ORDER BY stage_order
description: |
  Returns conversion funnel data — chart-ready 'name' (stage) and 'value' (count),
  plus a 'stage_order' so a funnel chart renders top-down even when stage names
  are not naturally sortable. The canonical order is
  Impressions → Clicks → Landing Page Views → Engaged Visits.
---
