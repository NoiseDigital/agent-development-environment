kind: tool
name: search_release_notes_bq
type: bigquery-sql
source: my-bq-source
statement: |
  SELECT
    product_name,description,published_at
  FROM
    `bigquery-public-data`.`google_cloud_release_notes`.`release_notes`
  WHERE
    DATE(published_at) >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
  GROUP BY product_name,description,published_at
  ORDER BY published_at DESC
description: |
  Use this tool to get information on Google Cloud Release Notes.
---
kind: tool
name: analyze_media_performance
type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Omit (empty) for no filter.
    required: false
    default: ""
  - name: publisher_filter
    type: string
    description: Filter by publisher. Omit (empty) for no filter.
    required: false
    default: ""
statement: |
  SELECT
    date_time as date,
    campaign_phase,
    publisher,
    platform,
    SUM(impressions) AS total_impressions,
    SUM(spend) AS total_spend,
    SUM(clicks) AS total_clicks,
    SAFE_DIVIDE(SUM(clicks), NULLIF(SUM(impressions), 0)) AS click_through_rate,
    SAFE_DIVIDE(SUM(spend), NULLIF(SUM(impressions), 0)) AS cost_per_impression
  FROM
    `nd-agentspace-sbx.media_performance.performance`
  WHERE
    (@date_from IS NULL OR date_time >= PARSE_DATE('%Y-%m-%d', @date_from))
    AND (@date_to IS NULL OR date_time <= PARSE_DATE('%Y-%m-%d', @date_to))
    AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) LIKE LOWER(CONCAT('%', @campaign_phase_filter, '%')))
    AND (@publisher_filter = '' OR LOWER(publisher) LIKE LOWER(CONCAT('%', @publisher_filter, '%')))
  GROUP BY date_time, campaign_phase, publisher, platform
  ORDER BY date_time DESC, total_spend DESC
description: |
  Analyze media performance by campaign phase, publisher and platform, with optional date and filter parameters.
