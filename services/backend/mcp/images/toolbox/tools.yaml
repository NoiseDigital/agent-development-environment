# ─────────────────────────────────────────────────────────────────────────────
# Public BigQuery sample tool — feeds the GCP release-notes example agent.
# Kept tiny and read-only: it's a separate playground from the media-performance
# toolset below and is loaded via its own `public_bq_toolset`.
# ─────────────────────────────────────────────────────────────────────────────
kind: tool
name: search_release_notes_bq
type: bigquery-sql
source: my-bq-source
statement: |
  SELECT
    product_name,description,published_at
  FROM
    `bigquery-public-data`.`google_cloud_release_notes`.`release_notes`
  WHERE
    DATE(published_at) >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
  GROUP BY product_name,description,published_at
  ORDER BY published_at DESC
description: |
  Use this tool to get information on Google Cloud Release Notes.
---
# ─────────────────────────────────────────────────────────────────────────────
# Media-performance toolset — the canonical query surface for the
# media_performance_agent. Each tool returns CHART-READY rows: a `name` and
# `value` column (and sometimes additional dimensions) the agent can drop into
# a Vega-Lite spec without reshaping.
#
# All tools query `media_campaign_performance_NOI` — the current schema.
# Columns of note:
#   date_time, line_id, creative_id_name, campaign_phase, campaign,
#   market_group, publisher, platform, objective, marketing_objective,
#   creative_format, creative_name, kpi_goal, budget,
#   total_spend, impressions, clicks, completed_views, landing_page_views,
#   engaged_visits
#
# Conventions:
# - `date_from` / `date_to` are YYYY-MM-DD strings with broad defaults that
#   expand to "all time" — the toolbox can't pass nil for an optional param.
# - Filters use `IN UNNEST(SPLIT(LOWER(@val), '|'))` so the value is matched
#   exactly (case-insensitive) AND multiple values can be passed in one
#   pipe-delimited string (e.g. "Meta|Google|Amazon"). Empty = no filter.
# - Every tool returning a series for charting names its columns `name` and
#   `value` so VegaChartsAgent doesn't need to remember per-tool field names.
# ─────────────────────────────────────────────────────────────────────────────
kind: tool
name: performance_trend
type: bigquery-sql
source: my-bq-source
parameters:
  - name: metric
    type: string
    description: Metric to trend (total_spend, impressions, clicks, landing_page_views, engaged_visits, completed_views). Defaults to total_spend.
    required: false
    default: total_spend
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Omit (empty) for no filter.
    required: false
    default: ""
statement: |
  -- A time-series trend that always spans the FULL requested range. The window
  -- is split into at most 48 equal-width buckets, so the result never exceeds
  -- the data layer's 50-row cap and even "all time" charts show every period.
  WITH filtered AS (
    SELECT
      DATE(date_time) AS d,
      total_spend, impressions, clicks, landing_page_views, engaged_visits, completed_views
    FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
    WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
      AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
      AND (@campaign_phase_filter = ''
           OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
  ),
  bounds AS (
    SELECT
      MIN(d) AS d0,
      GREATEST(1, CAST(CEIL((DATE_DIFF(MAX(d), MIN(d), DAY) + 1) / 48) AS INT64)) AS bucket_days
    FROM filtered
  )
  SELECT
    FORMAT_DATE('%Y-%m-%d',
      DATE_ADD(b.d0,
        INTERVAL DIV(DATE_DIFF(f.d, b.d0, DAY), b.bucket_days) * b.bucket_days DAY)) AS name,
    CASE @metric
      WHEN 'total_spend' THEN CAST(SUM(f.total_spend) AS FLOAT64)
      WHEN 'impressions' THEN CAST(SUM(f.impressions) AS FLOAT64)
      WHEN 'clicks' THEN CAST(SUM(f.clicks) AS FLOAT64)
      WHEN 'landing_page_views' THEN CAST(SUM(f.landing_page_views) AS FLOAT64)
      WHEN 'engaged_visits' THEN CAST(SUM(f.engaged_visits) AS FLOAT64)
      WHEN 'completed_views' THEN CAST(SUM(f.completed_views) AS FLOAT64)
      ELSE CAST(SUM(f.total_spend) AS FLOAT64)
    END AS value
  FROM filtered f
  CROSS JOIN bounds b
  GROUP BY name
  ORDER BY name
description: |
  Returns a time-series trend for the chosen metric in chart-ready format with
  'name' (the period's start date, YYYY-MM-DD) and 'value'. The requested date
  range is divided into at most 48 equal-width buckets, so the result always
  covers the WHOLE range. Call it once with the user's date range (or omit the
  dates for all-time) and chart every point — never drop or trim points. Use
  this for any "trend", "over time", "daily/weekly/monthly", or
  "spend since <year>" request.
---
kind: tool
name: publisher_spend_breakdown
type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Empty = no filter.
    required: false
    default: ""
  - name: market_group_filter
    type: string
    description: Filter by market group. Empty = no filter.
    required: false
    default: ""
  - name: creative_format_filter
    type: string
    description: Filter by creative format. Empty = no filter.
    required: false
    default: ""
  - name: kpi_goal_filter
    type: string
    description: Filter by KPI goal. Empty = no filter.
    required: false
    default: ""
statement: |
  SELECT
    publisher as name,
    CAST(SUM(total_spend) AS FLOAT64) as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
    AND publisher IS NOT NULL
    AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
    AND (@market_group_filter = ''    OR LOWER(market_group)    IN UNNEST(SPLIT(LOWER(@market_group_filter), '|')))
    AND (@creative_format_filter = '' OR LOWER(creative_format) IN UNNEST(SPLIT(LOWER(@creative_format_filter), '|')))
    AND (@kpi_goal_filter = ''        OR LOWER(kpi_goal)        IN UNNEST(SPLIT(LOWER(@kpi_goal_filter), '|')))
  GROUP BY publisher
  ORDER BY value DESC
  LIMIT 10
description: |
  Returns publisher spend breakdown in chart-ready format with 'name' (publisher) and 'value' (spend) for bar/pie charts.
