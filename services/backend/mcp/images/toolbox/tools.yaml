kind: tool
name: metric_series
type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Omit (empty) for no filter.
    required: false
    default: ""
  - name: publisher_filter
    type: string
    description: Filter by publisher (substring match). Empty = no filter.
    required: false
    default: ""
  - name: market_group_filter
    type: string
    description: Filter by market group (substring match). Empty = no filter.
    required: false
    default: ""
  - name: creative_format_filter
    type: string
    description: Filter by creative format (substring match). Empty = no filter.
    required: false
    default: ""
  - name: kpi_goal_filter
    type: string
    description: Filter by KPI goal (substring match). Empty = no filter.
    required: false
    default: ""
statement: |
  -- Weekly time-series of every metric in one row set — six KPI sparklines
  -- and the dual-axis trend chart all read from a SINGLE call instead of
  -- many round trips. Same 48-bucket spanning rule as `performance_trend`;
  -- every numeric column is CAST AS FLOAT64 so it serialises as a JSON
  -- number (BigQuery emits NUMERIC as strings).
  WITH filtered AS (
    SELECT
      DATE(date_time) AS d,
      total_spend, impressions, clicks, landing_page_views,
      engaged_visits, completed_views, budget
    FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
    WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
      AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
      AND (@campaign_phase_filter = '' OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
      AND (@publisher_filter = ''       OR LOWER(publisher)       IN UNNEST(SPLIT(LOWER(@publisher_filter), '|')))
      AND (@market_group_filter = ''    OR LOWER(market_group)    IN UNNEST(SPLIT(LOWER(@market_group_filter), '|')))
      AND (@creative_format_filter = '' OR LOWER(creative_format) IN UNNEST(SPLIT(LOWER(@creative_format_filter), '|')))
      AND (@kpi_goal_filter = ''        OR LOWER(kpi_goal)        IN UNNEST(SPLIT(LOWER(@kpi_goal_filter), '|')))
  ),
  bounds AS (
    SELECT
      MIN(d) AS d0,
      GREATEST(1, CAST(CEIL((DATE_DIFF(MAX(d), MIN(d), DAY) + 1) / 48) AS INT64)) AS bucket_days
    FROM filtered
  )
  SELECT
    FORMAT_DATE('%Y-%m-%d',
      DATE_ADD(b.d0,
        INTERVAL DIV(DATE_DIFF(f.d, b.d0, DAY), b.bucket_days) * b.bucket_days DAY)) AS name,
    CAST(SUM(f.total_spend) AS FLOAT64) AS total_spend,
    CAST(SUM(f.impressions) AS FLOAT64) AS impressions,
    CAST(SUM(f.clicks) AS FLOAT64) AS clicks,
    CAST(SUM(f.landing_page_views) AS FLOAT64) AS landing_page_views,
    CAST(SUM(f.engaged_visits) AS FLOAT64) AS engaged_visits,
    CAST(SUM(f.completed_views) AS FLOAT64) AS completed_views,
    CAST(SUM(f.budget) AS FLOAT64) AS budget,
    CAST(SAFE_DIVIDE(SUM(f.clicks), NULLIF(SUM(f.impressions), 0)) AS FLOAT64) AS ctr,
    CAST(SAFE_DIVIDE(SUM(f.engaged_visits), NULLIF(SUM(f.clicks), 0)) AS FLOAT64) AS cvr,
    CAST(SAFE_DIVIDE(SUM(f.total_spend) * 1000, NULLIF(SUM(f.impressions), 0)) AS FLOAT64) AS cpm,
    CAST(SAFE_DIVIDE(SUM(f.total_spend), NULLIF(SUM(f.clicks), 0)) AS FLOAT64) AS cpc,
    CAST(SAFE_DIVIDE(SUM(f.total_spend), NULLIF(SUM(f.engaged_visits), 0)) AS FLOAT64) AS cpa,
    CAST(SAFE_DIVIDE(SUM(f.completed_views), NULLIF(SUM(f.impressions), 0)) AS FLOAT64) AS vcr
  FROM filtered f
  CROSS JOIN bounds b
  GROUP BY name
  ORDER BY name
description: |
  Weekly time-series of every aggregate + derived rate the dashboard cares
  about — one row per bucket, all metrics as columns. Drives the KPI strip
  sparklines (one BQ call covers every card on the strip).
---
kind: tool
name: dimension_values
type: bigquery-sql
source: my-bq-source
parameters:
  - name: dimension
    type: string
    description: Column to list distinct values for (publisher, platform, campaign_phase, campaign, market_group, creative_format, kpi_goal, objective, marketing_objective).
    required: true
  - name: limit_rows
    type: integer
    description: Cap on values returned (sorted by impressions desc, so the busiest live values come first). Defaults to 50.
    required: false
    default: 50
statement: |
  -- Distinct values for one dimension column, ranked by impressions so the
  -- options the user actually sees are the ones with real traffic. The
  -- CASE-on-string for the dimension is the bigquery-sql idiom for "switch
  -- by parameter" — toolbox can't template column names, so only the
  -- allowlisted dimensions reach SQL.
  SELECT
    CASE @dimension
      WHEN 'publisher' THEN publisher
      WHEN 'platform' THEN platform
      WHEN 'campaign_phase' THEN campaign_phase
      WHEN 'campaign' THEN campaign
      WHEN 'market_group' THEN market_group
      WHEN 'creative_format' THEN creative_format
      WHEN 'kpi_goal' THEN kpi_goal
      WHEN 'objective' THEN objective
      WHEN 'marketing_objective' THEN marketing_objective
    END AS name,
    CAST(SUM(impressions) AS FLOAT64) AS value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  GROUP BY name
  HAVING name IS NOT NULL
  ORDER BY value DESC
  LIMIT @limit_rows
description: |
  Returns distinct values for one categorical dimension on the NOI dataset,
  ranked by impressions so the most-used options appear first. Columns
  allowlisted: publisher, platform, campaign_phase, campaign, market_group,
  creative_format, kpi_goal, objective, marketing_objective. Feeds the
  dashboard filter dropdowns and grounds the agent's clarifying questions.
---
kind: tool
name: available_date_range
type: bigquery-sql
source: my-bq-source
statement: |
  SELECT
    FORMAT_DATE('%Y-%m-%d', DATE(MIN(date_time))) AS earliest_date,
    FORMAT_DATE('%Y-%m-%d', DATE(MAX(date_time))) AS latest_date,
    COUNT(DISTINCT DATE(date_time)) AS distinct_days
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
description: |
  Returns the date range available in the media performance data: earliest_date,
  latest_date and distinct_days. Call this before asking the user to clarify a
  time period, so the options offered are grounded in the real available dates.
---
kind: tool
name: campaign_windows
type: bigquery-sql
source: my-bq-source
parameters:
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
  - name: campaign_phase_filter
    type: string
    description: Filter by campaign phase. Empty = no filter.
    required: false
    default: ""
statement: |
  -- Per-campaign flight windows derived from the row dates. Each campaign
  -- becomes one row with start_date / end_date / total_spend, which a
  -- frontend chart can overlay as a flight band behind a time series.
  --
  -- Bounded by the same date window the trend chart uses so a 30-day view
  -- doesn't drag in 2-year-old campaigns; the overlay should only show
  -- campaigns that touched the visible window.
  SELECT
    campaign AS name,
    FORMAT_DATE('%Y-%m-%d', MIN(DATE(date_time))) AS start_date,
    FORMAT_DATE('%Y-%m-%d', MAX(DATE(date_time))) AS end_date,
    CAST(SUM(total_spend) AS FLOAT64) AS total_spend
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
    AND (@campaign_phase_filter = ''
         OR LOWER(campaign_phase) IN UNNEST(SPLIT(LOWER(@campaign_phase_filter), '|')))
    AND campaign IS NOT NULL
  GROUP BY campaign
  ORDER BY total_spend DESC
description: |
  Returns one row per campaign that touched the date window, with
  start_date / end_date and total spend. Drives the flight-band overlay
  behind the trend chart so a spike or dip can be tied back to a campaign.
---
kind: toolset
name: public_bq_toolset
tools:
  - search_release_notes_bq
