kind: tool
name: top_performing_campaigns
type: bigquery-sql
source: my-bq-source
parameters:
  - name: metric
    type: string
    description: Metric to rank by (total_spend, impressions, clicks, landing_page_views, engaged_visits, completed_views). Defaults to total_spend.
    required: false
    default: total_spend
  - name: limit_rows
    type: integer
    description: Number of top campaigns to return (default 10)
    required: false
    default: 10
  - name: date_from
    type: string
    description: Start date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2000-01-01"
  - name: date_to
    type: string
    description: End date as a YYYY-MM-DD string. Omit for the full available history.
    required: false
    default: "2999-12-31"
statement: |
  SELECT
    CONCAT(campaign_phase, ' (', publisher, ')') as name,
    CASE @metric
      WHEN 'total_spend' THEN CAST(SUM(total_spend) AS FLOAT64)
      WHEN 'impressions' THEN CAST(SUM(impressions) AS FLOAT64)
      WHEN 'clicks' THEN CAST(SUM(clicks) AS FLOAT64)
      WHEN 'landing_page_views' THEN CAST(SUM(landing_page_views) AS FLOAT64)
      WHEN 'engaged_visits' THEN CAST(SUM(engaged_visits) AS FLOAT64)
      WHEN 'completed_views' THEN CAST(SUM(completed_views) AS FLOAT64)
      ELSE CAST(SUM(total_spend) AS FLOAT64)
    END as value
  FROM `nd-agentspace-sbx.media_performance.media_campaign_performance_NOI`
  WHERE date_time >= PARSE_DATE('%Y-%m-%d', @date_from)
    AND date_time <= PARSE_DATE('%Y-%m-%d', @date_to)
    AND campaign_phase IS NOT NULL
    AND publisher IS NOT NULL
  GROUP BY campaign_phase, publisher
  ORDER BY value DESC
  LIMIT @limit_rows
description: |
  Returns top performing campaigns in chart-ready format with 'name' (campaign + publisher) and 'value' (selected metric).
