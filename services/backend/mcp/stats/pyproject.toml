[project]
name = "mcp-stats"
version = "0.3.2"
description = "Statistics & correlation analysis MCP server"
requires-python = "==3.14.*"
dependencies = [
    "mcp==1.28.1",
    "google-adk==1.32.0",
    "starlette>=0.49.1,<1",
    "uvicorn==0.51.0",
    "python-dotenv==1.2.2",
    "httpx>=0.27.0",
    # Mints OIDC ID tokens to authenticate to the internal-ingress agent service
    # (resolve.py). Pulled in transitively by google-adk, but the auth hop
    # depends on it directly — pin it so a dep bump can't silently drop it.
    "google-auth>=2.55.2",
    "pandas>=3.0.3",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "statsmodels>=0.14.0",
    "openpyxl>=3.1.5",
    "google-cloud-bigquery>=3.42.2",
    "db-dtypes>=1.7.1",
    # Lets pandas read gs:// upload URIs in prod (STORAGE_BACKEND=gcs); ADC auth.
    "gcsfs>=2026.7.0",
]
