requires-python = ">=3.11"
dependencies = [
    "mcp==1.27.2",
    "google-adk==1.32.0",
    "starlette>=0.49.1,<1",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "openpyxl>=3.1.5",
    "google-cloud-bigquery>=3.27.0",
    "db-dtypes>=1.3.0",
    # Lets pandas read gs:// upload URIs in prod (STORAGE_BACKEND=gcs); ADC auth.
    "gcsfs>=2024.6.0",
]
