[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-agents"
version = "1.0.0"
description = "ADK Agent Development Environment"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "google-adk==1.32.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "asyncpg>=0.30.0",
    "toolbox-core>=0.5.4",
]

[tool.setuptools]
py-modules = ["main"]
